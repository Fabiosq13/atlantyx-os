<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<meta property="og:title" content="Fabio Quintanilha · CEO · Atlantyx">
<meta property="og:description" content="Cartão digital — dados, analytics e IA para grandes empresas. Fale comigo no WhatsApp ou agende uma conversa.">
<meta property="og:image" content="https://atlantyx-os.vercel.app/og-atlantyx.jpg">
<meta property="og:type" content="profile">
<link rel="icon" href="/logo-atlantyx-branco.png">
<title>Cartão — Atlantyx</title>
<style>
  :root { --azul:#1A3A8F; --azul2:#0F2660; --ouro:#E0A422; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:linear-gradient(160deg,#0F2660,#1A3A8F 60%,#0b1a45); color:#fff; display:flex; align-items:center; justify-content:center; padding:24px 14px; }
  .card { width:100%; max-width:420px; background:#fff; color:#1c2333; border-radius:22px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .topo { background:var(--azul); padding:22px 22px 72px; text-align:center; position:relative; }
  .acoes a:last-child:nth-child(odd) { grid-column:span 2; }
  .topo .logo { height:34px; max-width:78%; object-fit:contain; display:block; margin:4px auto 0; } /* v3.315: logo oficial no lugar do texto */
  .topo .marca { font-size:12px; letter-spacing:3px; color:var(--ouro); font-weight:800; }
  .foto { width:118px; height:118px; border-radius:50%; border:5px solid #fff; object-fit:cover; background:#e6e9f2; margin:-59px auto 0; display:block; box-shadow:0 6px 18px rgba(0,0,0,.2); position:relative; z-index:2; }
  .foto.vazia { display:flex; align-items:center; justify-content:center; font-size:44px; color:var(--azul); font-weight:800; }
  .nome { text-align:center; margin:12px 0 2px; font-size:24px; font-weight:800; color:var(--azul2); }
  .cargo { text-align:center; color:#5a6478; font-size:14px; }
  .tag { text-align:center; color:#8a93a8; font-size:12px; margin:4px 20px 0; }
  .acoes { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:18px 20px 6px; }
  .acoes a { display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; border-radius:11px; text-decoration:none; font-weight:700; font-size:14px; }
  .wa { background:#25D366; color:#fff; } .mail { background:var(--azul); color:#fff; } .tel { background:#eef1f8; color:var(--azul2); } .vcf { background:var(--ouro); color:#1c2333; }
  .qr { text-align:center; padding:12px 20px 6px; }
  .qr canvas, .qr img { border-radius:10px; border:1px solid #e3e7f0; padding:6px; background:#fff; }
  .qr .leg { font-size:11px; color:#8a93a8; margin-top:6px; }
  .info { padding:6px 22px 20px; font-size:12.5px; color:#5a6478; line-height:1.7; }
  .info div { display:flex; gap:8px; }
  .info span:first-child { width:18px; text-align:center; }
  .clientes { text-align:center; font-size:11px; color:#8a93a8; padding:0 20px 18px; }
  .rodape { text-align:center; font-size:11px; color:rgba(255,255,255,.5); margin-top:14px; }
</style>
</head>
<body>
<div>
<div class="card" id="card"><div style="padding:40px;text-align:center;color:#8a93a8;">Carregando...</div></div>
<div class="rodape">Atlantyx OS · cartão digital</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async () => {
  const r = await fetch('/api/prospeccao?cartao=1&t=' + Date.now(), { cache: 'no-store' }); const d = await r.json(); const c = d.cartao || {};
  const wa = String(c.whatsapp || c.telefone || '').replace(/[^0-9]/g, '');
  const waNum = wa ? (wa.length <= 11 ? '55' + wa : wa) : '';
  // v3.313: QR e botão abrem a conversa já com a apresentação (fundador + Atlantyx) e os links de apresentação e agendamento
  // v3.314: nunca cai na frase curta antiga — se o servidor não mandar a mensagem pronta, monta aqui a apresentação + links
  const W = c.whatsapp_msg || (() => { const B = location.origin, pn = (c.nome || '').split(' ')[0], emp = c.empresa || 'Atlantyx';
    const apresentacao = c.link_apresentacao || B + '/captura.html?utm_source=cartao&utm_medium=whatsapp', agendamento = c.link_agendamento || B + '/reuniao/cartao?f=cartao';
    const texto = c.texto_apresentacao || `Sou ${c.nome || ''}${c.cargo ? ', ' + c.cargo : ''} da ${emp}. Há 17 anos a ${emp} ajuda grandes empresas a transformar dados em decisões, com engenharia de dados, analytics e inteligência artificial aplicada à operação.`;
    const links = `\n\n📎 Apresentação da ${emp}: ${apresentacao}\n📅 Agende uma conversa comigo: ${agendamento}\n💳 Meu cartão digital: ${B}/cartao.html`;
    return { apresentacao, agendamento, mensagem_visitante: `Olá ${pn}! Peguei seu cartão digital da ${emp}.\n\n${texto}${links}`, mensagem_envio: `Olá! ${texto}${links}` }; })();
  const waLink = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(W.mensagem_visitante || ('Olá ' + (c.nome||'').split(' ')[0] + ', vi seu cartão da Atlantyx.'))}` : '';
  const shareLink = W.mensagem_envio ? 'https://wa.me/?text=' + encodeURIComponent(W.mensagem_envio) : '';
  // v3.313: QR curto (/cartao.html?wa=1) → redireciona direto para o WhatsApp com a mensagem (QR com a mensagem inteira ficava denso demais para a câmera)
  if (new URLSearchParams(location.search).has('wa') && waLink) { location.replace(waLink); return; }
  const qrAlvo = location.origin + '/cartao.html?wa=1';
  const E = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const ini = (c.nome || 'A').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('card').innerHTML = `
    <div class="topo"><img class="logo" src="/logo-atlantyx-branco.png" alt="${E(c.empresa||'Atlantyx')}"></div>
    ${c.foto_url ? `<img class="foto" src="${c.foto_url}" alt="${c.nome||''}">` : `<div class="foto vazia">${ini}</div>`}
    <div class="nome">${c.nome||''}</div>
    <div class="cargo">${[c.cargo, c.empresa].filter(Boolean).join(' · ')}</div>
    ${c.tagline ? `<div class="tag">${c.tagline}</div>` : ''}
    <div class="acoes">
      ${waLink ? `<a class="wa" href="${waLink}" target="_blank">💬 WhatsApp</a>` : ''}
      ${c.email ? `<a class="mail" href="mailto:${c.email}">✉ E-mail</a>` : ''}
      ${c.telefone ? `<a class="tel" href="tel:+${String(c.telefone).replace(/[^0-9]/g,'')}">📞 Ligar</a>` : ''}
      <a class="vcf" href="/api/prospeccao?vcard=1">💾 Salvar contato</a>
      ${W.apresentacao ? `<a class="tel" href="${E(W.apresentacao)}" target="_blank" rel="noopener">📎 Apresentação</a>` : ''}
      ${W.agendamento ? `<a class="mail" href="${E(W.agendamento)}" target="_blank" rel="noopener">📅 Agendar conversa</a>` : ''}
    </div>
    ${shareLink ? `<div style="padding:4px 20px 0;"><a href="${E(shareLink)}" target="_blank" rel="noopener" style="display:block;text-align:center;padding:10px;border-radius:11px;border:1.5px solid #25D366;color:#128C4A;font-weight:700;font-size:13px;text-decoration:none;">📤 Enviar este cartão pelo WhatsApp</a></div>` : ''}
    <div class="qr"><div id="qr"></div><div class="leg">${waLink ? 'Aponte a câmera: o WhatsApp abre com a apresentação e os links de apresentação e agendamento' : '<span style="color:#D64545;">Informe o telefone/WhatsApp na edição do cartão para o QR aparecer</span>'}</div></div>
    <div class="info">
      ${c.email ? `<div><span>✉</span><span>${c.email}</span></div>` : ''}
      ${c.telefone ? `<div><span>📞</span><span>+${String(c.telefone).replace(/[^0-9]/g,'')}</span></div>` : ''}
      ${c.site ? `<div><span>🌐</span><a href="${c.site}" target="_blank" style="color:#1A3A8F;">${c.site.replace(/^https?:\/\//,'')}</a></div>` : ''}
      ${c.linkedin ? `<div><span>in</span><a href="${c.linkedin}" target="_blank" style="color:#1A3A8F;">LinkedIn</a></div>` : ''}
      ${c.endereco_rj ? `<div><span>📍</span><span>${c.endereco_rj}</span></div>` : ''}
      ${c.endereco_sp ? `<div><span>📍</span><span>${c.endereco_sp}</span></div>` : ''}
    </div>
    ${c.clientes ? `<div class="clientes">Clientes: ${c.clientes}</div>` : ''}`;
  // v2.62: QR com fallback — se a biblioteca do CDN não carregar, usa um gerador de imagem
  if (waLink) {
    const box = document.getElementById('qr');
    if (window.QRCode) { try { new QRCode(box, { text: qrAlvo, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); } catch (_) {} } // v3.313: mensagem longa → QR maior e correção L
    if (!box.querySelector('canvas,img')) box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=${encodeURIComponent(qrAlvo)}" width="190" height="190" alt="QR WhatsApp">`;
  }
  document.title = (c.nome || 'Cartão') + ' — ' + (c.empresa || 'Atlantyx');
})().catch(e => { document.getElementById('card').innerHTML = '<div style="padding:30px;color:#D64545;">' + e.message + '</div>'; });
</script>
</body>
</html>
