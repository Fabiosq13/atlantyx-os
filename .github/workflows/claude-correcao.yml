# Correção automática com o Claude (v3.16)
# Disparo: o Atlantyx OS abre uma issue (label "correcao-automatica") começando com "@claude"
# a partir do relatório aprovado do Agente de QA / Segurança, ou alguém comenta "@claude" numa issue/PR.
# O Claude implementa as correções numa branch e abre um PULL REQUEST — nada vai para produção
# sem o merge feito por uma pessoa (a Vercel publica ao fazer merge na main).
#
# Configuração única:
#   1. Instalar o app do Claude no repositório: https://github.com/apps/claude
#   2. Settings → Secrets and variables → Actions → New secret: ANTHROPIC_API_KEY
#   3. No Vercel: GITHUB_TOKEN = token fine-grained (Issues: Read and write neste repositório).
#      Issue criada com o GITHUB_TOKEN padrão do Actions não dispara workflows — por isso o token pessoal.
name: Claude — correção automática
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
concurrency:
  group: claude-correcao-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  claude:
    # v3.99: em comentário, só dispara quando o COMENTÁRIO chama o @claude (antes qualquer comentário numa tarefa
    # com @claude no corpo — ex.: os comandos /atx- da Esteira — ocupava um robô à toa)
    if: (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, '/atx-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # v3.145 · Método B.P.M.: a trilha da tarefa (linha "BPM-Trilha:") vira BPM_TRILHA/.bpm-trilha — o hook
      # .claude/hooks/escopo-trilha.mjs bloqueia edição fora do escopo, DDL fora da T5 e mudança de versão
      - name: Trilha B.P.M. da tarefa
        env:
          CORPO: ${{ github.event.issue.body }}
        run: |
          T=$(printf '%s' "$CORPO" | grep -oE '^BPM-Trilha:[[:space:]]*(T[0-9]+|P-[a-z0-9-]+)' | head -1 | sed -E 's/^BPM-Trilha:[[:space:]]*//' || true)
          I=$(printf '%s' "$CORPO" | grep -oE '^BPM-ID:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+' | head -1 | sed -E 's/^BPM-ID:[[:space:]]*//' || true)
          if [ -n "$T" ]; then printf '%s\n%s\n' "$T" "$I" > .bpm-trilha; echo "BPM_TRILHA=$T" >> "$GITHUB_ENV"; echo "BPM_ID=$I" >> "$GITHUB_ENV"; echo "Trilha $T · $I"; else echo "Tarefa sem trilha B.P.M. (correção noturna ou pedido avulso)"; fi
      # v3.146 · Produto da Esteira de Entrega ("BPM-Produto: <projeto>"): baixa os documentos aprovados (ERF, ERT,
      # arquitetura, backlog, casos de teste) para produtos/<pasta>/partitura/ antes do Claude começar
      - name: Partitura do produto
        env:
          CORPO: ${{ github.event.issue.body }}
          ATX_URL: ${{ vars.ATX_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          P=$(printf '%s' "$CORPO" | grep -oE '^BPM-Produto:[[:space:]]*[A-Za-z0-9_-]+' | head -1 | sed -E 's/^BPM-Produto:[[:space:]]*//' || true)
          if [ -z "$P" ]; then echo "Tarefa sem produto da Esteira de Entrega"; exit 0; fi
          URL="${ATX_URL:-https://atlantyx-os.vercel.app}"
          CODE=$(curl -s -o /tmp/pacote.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$URL/api/fabrica?action=construcao_pacote&projeto=$P" || echo 000)
          if [ "$CODE" != "200" ]; then echo "::warning title=Partitura do produto::HTTP $CODE ao baixar os documentos do projeto $P (CRON_SECRET igual ao do Vercel? ATX_URL correta?) — o Claude segue só com o corpo da tarefa"; exit 0; fi
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/pacote.json','utf8'));if(!/^[a-z0-9][a-z0-9-]{1,40}$/.test(d.pasta||''))throw new Error('pasta inválida');const dir='produtos/'+d.pasta+'/partitura';fs.mkdirSync(dir,{recursive:true});for(const a of d.arquivos||[]){if(!/^[\\w.-]+\\.md$/.test(a.nome))continue;fs.writeFileSync(dir+'/'+a.nome,a.conteudo);}console.log((d.arquivos||[]).length+' documento(s) em '+dir);"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: "--max-turns 80"
